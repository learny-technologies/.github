# A repository absent from this map authorizes nobody for production; the
# deployment plan fails closed. Delegating an entry is an owner decision
# recorded in an execution record, not a configuration convenience.
#
# The flat `production_actor_ids` form is still accepted by load_authorities so
# that repositories pinned to an older automation revision keep deploying while
# their pin is raised. Do not add new entries in that form.
