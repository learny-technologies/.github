name: Reusable source gate

on:
  workflow_call:
    inputs:
      automation_ref:
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository automation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: learny-technologies/.github
          ref: ${{ inputs.automation_ref }}
          path: .learny-automation
          persist-credentials: false
      - name: Install schema validator
        run: >-
          python -m pip install --disable-pip-version-check
          -r .learny-automation/requirements-dev.txt
      - name: Validate repository automation
        run: >-
          python .learny-automation/scripts/validate_automation.py
          automation.yaml
          --repository-root .
      - name: Validate canonical product manifest
        if: ${{ hashFiles('project.yaml') != '' }}
        run: >-
          python .learny-automation/scripts/validate_product_manifest.py
          project.yaml
