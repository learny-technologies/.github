name: Reusable OCI publication

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      component_id:
        required: true
        type: string
      execution_record_json:
        required: true
        type: string
      automation_revision:
        required: true
        type: string
      execution_record_app_id:
        required: true
        type: string
    secrets:
      EXECUTION_RECORD_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    name: Publish immutable OCI artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Validate immutable inputs
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          AUTOMATION_REVISION: ${{ inputs.automation_revision }}
          COMPONENT_ID: ${{ inputs.component_id }}
        run: |
          python - <<'PY'
          import os
          import re

          sha = re.compile(r"^[0-9a-f]{40}$")
          identifier = re.compile(r"^[a-z0-9][a-z0-9-]{0,79}$")
          if sha.fullmatch(os.environ["SOURCE_SHA"]) is None:
              raise SystemExit("source_sha must be an exact Git SHA")
          if sha.fullmatch(os.environ["AUTOMATION_REVISION"]) is None:
              raise SystemExit("automation_revision must be an exact Git SHA")
          if identifier.fullmatch(os.environ["COMPONENT_ID"]) is None:
              raise SystemExit("component_id is invalid")
          PY

      - name: Check out trusted automation implementation
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: learny-technologies/.github
          ref: ${{ inputs.automation_revision }}
          path: .learny-automation
          persist-credentials: false

      - name: Check out exact artifact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.source_sha }}
          path: release-source
          persist-credentials: false

      - name: Create handbook-scoped read token
        id: execution-record-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ inputs.execution_record_app_id }}
          private-key: ${{ secrets.EXECUTION_RECORD_APP_PRIVATE_KEY }}
          owner: learny-technologies
          repositories: engineering-handbook-workspace
          permission-contents: read

      - name: Check out immutable execution record
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: ${{ fromJSON(inputs.execution_record_json).repository }}
          ref: ${{ fromJSON(inputs.execution_record_json).revision }}
          path: .execution-record
          token: ${{ steps.execution-record-token.outputs.token }}
          persist-credentials: false

      - name: Install automation validator
        run: >-
          python -m pip install --disable-pip-version-check
          -r .learny-automation/requirements-dev.txt

      - name: Resolve declared artifact
        id: artifact
        env:
          SOURCE_REVISION: ${{ inputs.source_sha }}
        run: >-
          python .learny-automation/scripts/resolve_automation.py
          release-source/automation.yaml
          --repository-root release-source
          --artifact "${{ inputs.component_id }}"
          --github-output "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Resolve reusable artifact
        id: reuse
        env:
          IMAGE: ${{ steps.artifact.outputs.image }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          AUTOMATION_REVISION: ${{ inputs.automation_revision }}
        run: |
          set -euo pipefail
          tag="${IMAGE}:sha-${SOURCE_SHA}"
          if ! digest="$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"')"; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Existing SHA tag has invalid registry identity" >&2
            exit 1
          fi
          immutable="${IMAGE}@${digest}"
          cosign verify \
            --certificate-identity-regexp "^https://github.com/learny-technologies/\\.github/\\.github/workflows/reusable-oci-publish\\.yml@${AUTOMATION_REVISION}$" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$immutable" >/dev/null
          python .learny-automation/scripts/verify_registry_evidence.py \
            --image "$immutable" \
            --repository "$GITHUB_REPOSITORY" \
            --source-revision "$SOURCE_SHA" \
            --automation-revision "$AUTOMATION_REVISION"
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Build and publish exact source
        id: build
        if: ${{ steps.reuse.outputs.found != 'true' }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: release-source/${{ steps.artifact.outputs.context }}
          file: release-source/${{ steps.artifact.outputs.dockerfile }}
          platforms: ${{ steps.artifact.outputs.platforms }}
          push: true
          tags: ${{ steps.artifact.outputs.image }}:sha-${{ inputs.source_sha }}
          labels: |
            org.opencontainers.image.revision=${{ inputs.source_sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            io.learny.automation.revision=${{ inputs.automation_revision }}
          build-args: ${{ steps.artifact.outputs.build_args }}
          cache-from: type=gha,scope=${{ inputs.component_id }}
          cache-to: type=gha,mode=max,scope=${{ inputs.component_id }}
          provenance: mode=max,version=v1
          sbom: true

      - name: Sign new immutable digest
        if: ${{ steps.reuse.outputs.found != 'true' }}
        env:
          IMAGE: ${{ steps.artifact.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Create release manifest
        env:
          DIGEST: ${{ steps.reuse.outputs.digest || steps.build.outputs.digest }}
          REUSED: ${{ steps.reuse.outputs.found }}
          EXECUTION_RECORD_JSON: ${{ inputs.execution_record_json }}
        run: |
          args=()
          if [[ "$REUSED" == "true" ]]; then args+=(--reused); fi
          python .learny-automation/scripts/delivery_contract.py release \
            --repository "$GITHUB_REPOSITORY" \
            --source-sha "${{ inputs.source_sha }}" \
            --component-id "${{ inputs.component_id }}" \
            --image "${{ steps.artifact.outputs.image }}" \
            --digest "$DIGEST" \
            --automation-revision "${{ inputs.automation_revision }}" \
            --execution-record-json "$EXECUTION_RECORD_JSON" \
            --execution-record-root .execution-record \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            "${args[@]}" \
            --output release.json

      - name: Upload immutable release manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ inputs.component_id }}-${{ inputs.source_sha }}
          path: release.json
          if-no-files-found: error
          retention-days: 90
