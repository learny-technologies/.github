name: Reusable automation validation

on:
  workflow_call:
    inputs:
      automation_revision:
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Automation contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Check out trusted automation implementation
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: learny-technologies/.github
          ref: ${{ inputs.automation_revision }}
          path: .learny-automation
          persist-credentials: false

      - name: Install validator dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          -r .learny-automation/requirements-dev.txt

      - name: Validate repository automation contract
        run: >-
          python .learny-automation/scripts/validate_automation.py
          automation.yaml --repository-root .
