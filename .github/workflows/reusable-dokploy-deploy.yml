name: Reusable Dokploy deployment

on:
  workflow_call:
    inputs:
      operation_id:
        required: true
        type: string
      environment:
        required: true
        type: string
      pipeline_id:
        required: true
        type: string
      automation_ref:
        required: true
        type: string

permissions:
  actions: read
  attestations: read
  contents: read
  id-token: write
  packages: read

jobs:
  deploy:
    name: Execute authorized deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: ${{ inputs.environment }}
    concurrency:
      group: ${{ github.repository }}-${{ inputs.environment }}-${{ inputs.pipeline_id }}
      cancel-in-progress: false
    env:
      CONTROL_PLANE_URL: ${{ vars.CONTROL_PLANE_URL || 'https://api.platform.learny.technology' }}
      CONTROL_PLANE_DEPLOYMENT_AUDIENCE: ${{ vars.CONTROL_PLANE_DEPLOYMENT_AUDIENCE || 'https://api.platform.learny.technology/deployments' }}
      GH_TOKEN: ${{ github.token }}
      DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
      DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}
      DOKPLOY_APPLICATION_ID: ${{ secrets.DOKPLOY_APPLICATION_ID }}
      DOKPLOY_STICKIFY_MIGRATION_APPLICATION_ID: ${{ secrets.DOKPLOY_STICKIFY_MIGRATION_APPLICATION_ID }}
      DOKPLOY_STICKIFY_CORE_APPLICATION_ID: ${{ secrets.DOKPLOY_STICKIFY_CORE_APPLICATION_ID }}
      DOKPLOY_STICKIFY_WORKER_APPLICATION_ID: ${{ secrets.DOKPLOY_STICKIFY_WORKER_APPLICATION_ID }}
      STICKIFY_CORE_BASE_URL: ${{ vars.STICKIFY_CORE_BASE_URL }}
      STIQI_LANDING_BASE_URL: ${{ vars.STIQI_LANDING_BASE_URL }}
      TRACE_DELIVERY_OPENBAO_ADDRESS: ${{ vars.TRACE_DELIVERY_OPENBAO_ADDRESS }}
      TRACE_DELIVERY_OPENBAO_AUDIENCE: ${{ vars.TRACE_DELIVERY_OPENBAO_AUDIENCE }}
      TRACE_DELIVERY_OPENBAO_AUTH_MOUNT: ${{ vars.TRACE_DELIVERY_OPENBAO_AUTH_MOUNT }}
      TRACE_DELIVERY_OPENBAO_ROLE: ${{ vars.TRACE_DELIVERY_OPENBAO_ROLE }}
      TRACE_DELIVERY_DOKPLOY_SECRET_PATH: ${{ vars.TRACE_DELIVERY_DOKPLOY_SECRET_PATH }}
      TRACE_DEV_DOKPLOY_URL: ${{ vars.TRACE_DEV_DOKPLOY_URL }}
      TRACE_DEV_API_URL: ${{ vars.TRACE_DEV_API_URL }}
      TRACE_DEV_API_COMPOSE_ID: ${{ vars.TRACE_DEV_API_COMPOSE_ID }}
      TRACE_DEV_API_APP_NAME: ${{ vars.TRACE_DEV_API_APP_NAME }}
      TRACE_DEV_MIGRATION_COMPOSE_ID: ${{ vars.TRACE_DEV_MIGRATION_COMPOSE_ID }}
      TRACE_DEV_MIGRATION_APP_NAME: ${{ vars.TRACE_DEV_MIGRATION_APP_NAME }}
    steps:
      - name: Check out trusted automation implementation
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: learny-technologies/.github
          ref: ${{ inputs.automation_ref }}
          path: .learny-automation
          persist-credentials: false

      - name: Claim Control Plane deployment operation
        id: claim
        run: >-
          python .learny-automation/scripts/deployment_operation.py claim
          --operation-id "${{ inputs.operation_id }}"
          --expected-pipeline "${{ inputs.pipeline_id }}"
          --expected-environment "${{ inputs.environment }}"

      - name: Install automation validator
        run: >-
          python -m pip install --disable-pip-version-check
          -r .learny-automation/requirements-dev.txt

      - name: Check out exact release source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ steps.claim.outputs.source_sha }}
          path: release-source
          persist-credentials: false

      - name: Resolve authorized delivery executor
        id: pipeline
        run: >-
          python .learny-automation/scripts/resolve_automation.py
          release-source/automation.yaml
          --repository-root release-source
          --pipeline "${{ steps.claim.outputs.pipeline_id }}"
          --github-output "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify, migrate, roll out, and record evidence
        id: delivery
        run: >-
          python "release-source/${{ steps.pipeline.outputs.executor }}" execute
          --source-root release-source

      - name: Record fail-closed workflow failure
        if: ${{ failure() && steps.claim.outcome == 'success' }}
        run: >-
          python .learny-automation/scripts/deployment_operation.py fail
          --operation-id "${{ inputs.operation_id }}"
          --message "Authorized deployment workflow failed"
