name: Reusable Dokploy deployment

on:
  workflow_call:
    inputs:
      operation_id:
        required: true
        type: string
      environment:
        required: true
        type: string
      pipeline_id:
        required: true
        type: string

permissions:
  actions: read
  attestations: read
  contents: read
  id-token: write
  packages: read

jobs:
  deploy:
    name: Execute authorized deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: ${{ inputs.environment }}
    concurrency:
      group: ${{ github.repository }}-${{ inputs.environment }}-${{ inputs.pipeline_id }}
      cancel-in-progress: false
    env:
      CONTROL_PLANE_URL: ${{ vars.CONTROL_PLANE_URL || 'https://api.platform.learny.technology' }}
      CONTROL_PLANE_DEPLOYMENT_AUDIENCE: ${{ vars.CONTROL_PLANE_DEPLOYMENT_AUDIENCE || 'https://api.platform.learny.technology/deployments' }}
      GH_TOKEN: ${{ github.token }}
      STICKIFY_CORE_BASE_URL: ${{ vars.STICKIFY_CORE_BASE_URL }}
      STIQI_LANDING_BASE_URL: ${{ vars.STIQI_LANDING_BASE_URL }}
      TRACE_DELIVERY_OPENBAO_ADDRESS: ${{ vars.TRACE_DELIVERY_OPENBAO_ADDRESS }}
      TRACE_DELIVERY_OPENBAO_AUDIENCE: ${{ vars.TRACE_DELIVERY_OPENBAO_AUDIENCE }}
      TRACE_DELIVERY_OPENBAO_AUTH_MOUNT: ${{ vars.TRACE_DELIVERY_OPENBAO_AUTH_MOUNT }}
      TRACE_DELIVERY_OPENBAO_ROLE: ${{ vars.TRACE_DELIVERY_OPENBAO_ROLE }}
      TRACE_DELIVERY_DOKPLOY_SECRET_PATH: ${{ vars.TRACE_DELIVERY_DOKPLOY_SECRET_PATH }}
      TRACE_DEV_DOKPLOY_URL: ${{ vars.TRACE_DEV_DOKPLOY_URL }}
      TRACE_DEV_API_URL: ${{ vars.TRACE_DEV_API_URL }}
      TRACE_DEV_API_COMPOSE_ID: ${{ vars.TRACE_DEV_API_COMPOSE_ID }}
      TRACE_DEV_API_APP_NAME: ${{ vars.TRACE_DEV_API_APP_NAME }}
      TRACE_DEV_MIGRATION_COMPOSE_ID: ${{ vars.TRACE_DEV_MIGRATION_COMPOSE_ID }}
      TRACE_DEV_MIGRATION_APP_NAME: ${{ vars.TRACE_DEV_MIGRATION_APP_NAME }}
      CONTROL_PLANE_DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
      CONTROL_PLANE_COMPOSE_ID: ${{ vars.DOKPLOY_CONTROL_PLANE_COMPOSE_ID }}
    steps:
      - name: Claim Control Plane deployment operation
        id: claim
        env:
          OPERATION_ID: ${{ inputs.operation_id }}
          EXPECTED_PIPELINE: ${{ inputs.pipeline_id }}
          EXPECTED_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.parse
          import urllib.request
          from pathlib import Path

          sha = re.compile(r"^[0-9a-f]{40}$")
          identifier = re.compile(r"^[a-z0-9][a-z0-9-]{0,79}$")
          request_url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          separator = "&" if "?" in request_url else "?"
          oidc_request = urllib.request.Request(
              request_url
              + separator
              + "audience="
              + urllib.parse.quote(
                  os.environ["CONTROL_PLANE_DEPLOYMENT_AUDIENCE"], safe=""
              ),
              headers={
                  "Authorization": "Bearer "
                  + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
              },
          )
          with urllib.request.urlopen(oidc_request, timeout=30) as response:
              token = json.load(response).get("value")
          if not isinstance(token, str) or not token:
              raise SystemExit("GitHub Actions OIDC token was not issued")

          operation_id = os.environ["OPERATION_ID"]
          claim_request = urllib.request.Request(
              os.environ["CONTROL_PLANE_URL"].rstrip("/")
              + f"/v1/deployments/operations/{operation_id}/claim",
              data=b"{}",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(claim_request, timeout=30) as response:
              plan = json.load(response)
          Path(".delivery-state.json").write_text(
              '{"claimed":true,"completed":false,"sequence":0}\n'
          )
          if plan.get("version") == "v1":
              returned_operation_id = plan.get("operation_id")
              pipeline_id = plan.get("pipeline_id")
              environment_id = plan.get("environment_id")
              source_revision = plan.get("source_revision")
              executor = plan.get("executor", {})
              automation_revision = executor.get("revision")
          elif plan.get("version") is None:
              operation = plan.get("operation", {})
              release = plan.get("release", {})
              returned_operation_id = operation.get("id")
              pipeline_id = operation.get("pipeline_id")
              environment_id = operation.get("environment_id")
              source_revision = release.get("source_revision")
              automation_revision = (
                  operation.get("evidence", {}).get("automation_revision")
              )
          else:
              raise SystemExit(
                  "Control Plane returned an unsupported deployment plan version"
              )
          if returned_operation_id != operation_id:
              raise SystemExit("Control Plane returned a different deployment operation")
          if not isinstance(pipeline_id, str) or identifier.fullmatch(pipeline_id) is None:
              raise SystemExit("Control Plane returned an invalid pipeline")
          if (
              not isinstance(environment_id, str)
              or identifier.fullmatch(environment_id) is None
          ):
              raise SystemExit("Control Plane returned an invalid environment")
          if not isinstance(source_revision, str) or sha.fullmatch(source_revision) is None:
              raise SystemExit("Control Plane returned an invalid source revision")
          if (
              not isinstance(automation_revision, str)
              or sha.fullmatch(automation_revision) is None
          ):
              raise SystemExit("Control Plane returned an invalid automation revision")
          if (
              pipeline_id != os.environ["EXPECTED_PIPELINE"]
              or environment_id != os.environ["EXPECTED_ENVIRONMENT"]
          ):
              raise SystemExit(
                  "Control Plane authorization does not match the requested target"
              )

          Path(".delivery-plan.json").write_text(
              json.dumps(plan, sort_keys=True, separators=(",", ":")) + "\n"
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"pipeline_id={pipeline_id}\n")
              output.write(f"environment={environment_id}\n")
              output.write(f"source_sha={source_revision}\n")
              output.write(f"automation_revision={automation_revision}\n")
          PY

      - name: Check out trusted automation implementation
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: learny-technologies/.github
          ref: ${{ steps.claim.outputs.automation_revision }}
          path: .learny-automation
          persist-credentials: false

      - name: Install automation validator
        run: >-
          python -m pip install --disable-pip-version-check
          -r .learny-automation/requirements-dev.txt

      - name: Check out exact release source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ steps.claim.outputs.source_sha }}
          path: release-source
          persist-credentials: false

      - name: Resolve authorized delivery executor
        id: pipeline
        run: >-
          python .learny-automation/scripts/resolve_automation.py
          release-source/automation.yaml
          --repository-root release-source
          --pipeline "${{ steps.claim.outputs.pipeline_id }}"
          --github-output "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Execute Stiqi Core delivery
        if: >-
          ${{ github.repository == 'learny-technologies/stickify-core'
              && steps.claim.outputs.pipeline_id == 'backend' }}
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}
          DOKPLOY_STICKIFY_MIGRATION_APPLICATION_ID: ${{ secrets.DOKPLOY_STICKIFY_MIGRATION_APPLICATION_ID }}
          DOKPLOY_STICKIFY_CORE_APPLICATION_ID: ${{ secrets.DOKPLOY_STICKIFY_CORE_APPLICATION_ID }}
          DOKPLOY_STICKIFY_WORKER_APPLICATION_ID: ${{ secrets.DOKPLOY_STICKIFY_WORKER_APPLICATION_ID }}
        run: >-
          python "release-source/${{ steps.pipeline.outputs.executor }}" execute
          --source-root release-source

      - name: Execute Stiqi landing delivery
        if: >-
          ${{ github.repository == 'learny-technologies/stiqi-web-landing'
              && steps.claim.outputs.pipeline_id == 'landing' }}
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_TOKEN: ${{ secrets.DOKPLOY_API_TOKEN }}
          DOKPLOY_APPLICATION_ID: ${{ secrets.DOKPLOY_APPLICATION_ID }}
        run: >-
          python "release-source/${{ steps.pipeline.outputs.executor }}" execute
          --source-root release-source

      - name: Execute Trace delivery
        if: >-
          ${{ github.repository == 'learny-technologies/trace-workspace'
              && steps.claim.outputs.pipeline_id == 'backend' }}
        run: >-
          python "release-source/${{ steps.pipeline.outputs.executor }}" execute
          --source-root release-source

      - name: Execute Control Plane delivery
        if: >-
          ${{ github.repository == 'learny-technologies/control-plane-workspace'
              && steps.claim.outputs.pipeline_id == 'platform' }}
        env:
          CONTROL_PLANE_DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
        run: >-
          python "release-source/${{ steps.pipeline.outputs.executor }}" execute
          --source-root release-source

      - name: Reject unsupported delivery credential profile
        if: >-
          ${{ !(
              (github.repository == 'learny-technologies/stickify-core'
               && steps.claim.outputs.pipeline_id == 'backend')
              || (github.repository == 'learny-technologies/stiqi-web-landing'
                  && steps.claim.outputs.pipeline_id == 'landing')
              || (github.repository == 'learny-technologies/trace-workspace'
                  && steps.claim.outputs.pipeline_id == 'backend')
              || (github.repository
                  == 'learny-technologies/control-plane-workspace'
                  && steps.claim.outputs.pipeline_id == 'platform')
              ) }}
        run: |
          echo "Unsupported repository and pipeline credential profile" >&2
          exit 1

      - name: Record fail-closed claim processing failure
        if: >-
          ${{ failure()
              && steps.claim.outcome == 'failure'
              && hashFiles('.delivery-state.json') != '' }}
        env:
          OPERATION_ID: ${{ inputs.operation_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          request_url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          separator = "&" if "?" in request_url else "?"
          oidc_request = urllib.request.Request(
              request_url
              + separator
              + "audience="
              + urllib.parse.quote(
                  os.environ["CONTROL_PLANE_DEPLOYMENT_AUDIENCE"], safe=""
              ),
              headers={
                  "Authorization": "Bearer "
                  + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
              },
          )
          with urllib.request.urlopen(oidc_request, timeout=30) as response:
              token = json.load(response).get("value")
          if not isinstance(token, str) or not token:
              raise SystemExit("GitHub Actions OIDC token was not issued")

          operation_id = os.environ["OPERATION_ID"]
          complete_request = urllib.request.Request(
              os.environ["CONTROL_PLANE_URL"].rstrip("/")
              + f"/v1/deployments/operations/{operation_id}/complete",
              data=json.dumps(
                  {
                      "sequence": 1,
                      "outcome": "failed",
                      "github_run_url": (
                          f"{os.environ['GITHUB_SERVER_URL']}/"
                          f"{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
                          f"{os.environ['GITHUB_RUN_ID']}"
                      ),
                      "provenance_verified": False,
                      "rollback_eligible": False,
                      "evidence": {
                          "version": "v1",
                          "failure_stage": "claim_processing_failed",
                      },
                      "failure_code": "claim_processing_failed",
                      "failure_message": (
                          "Authorized deployment claim response could not be processed"
                      ),
                  },
                  separators=(",", ":"),
              ).encode(),
              headers={
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          with urllib.request.urlopen(complete_request, timeout=30):
              pass
          PY

      - name: Record fail-closed workflow failure
        if: ${{ failure() && steps.claim.outcome == 'success' }}
        run: >-
          python .learny-automation/scripts/deployment_operation.py fail
          --operation-id "${{ inputs.operation_id }}"
          --message "Authorized deployment workflow failed"
