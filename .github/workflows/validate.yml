name: Validate automation

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: automation-contract-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Automation contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Validate automation contract
        run: python scripts/validate_automation.py automation.yaml --repository-root .
      - name: Run automation tests
        run: python -m unittest discover -s tests -v
