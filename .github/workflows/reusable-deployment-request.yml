name: Reusable deployment request

on:
  workflow_call:
    inputs:
      project_id:
        required: true
        type: string
      environment:
        required: true
        type: string
      pipeline_id:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      definition_hash:
        required: true
        type: string
      migration_heads_json:
        required: false
        default: "[]"
        type: string
      rollback_compatible:
        required: false
        default: false
        type: boolean
      reason:
        required: true
        type: string
    outputs:
      operation_id:
        description: Control Plane deployment operation UUID
        value: ${{ jobs.request.outputs.operation_id }}
      operation_status:
        description: Initial Control Plane deployment operation status
        value: ${{ jobs.request.outputs.operation_status }}

permissions:
  contents: read
  id-token: write

jobs:
  request:
    name: Request authorized deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: ${{ inputs.environment }}
    concurrency:
      group: >-
        deployment-request-${{ github.repository }}-${{ inputs.environment }}-${{ inputs.pipeline_id }}
      cancel-in-progress: false
    outputs:
      operation_id: ${{ steps.request.outputs.operation_id }}
      operation_status: ${{ steps.request.outputs.operation_status }}
    env:
      CONTROL_PLANE_URL: ${{ vars.CONTROL_PLANE_URL || 'https://api.platform.learny.technology' }}
      CONTROL_PLANE_DEPLOYMENT_AUDIENCE: ${{ vars.CONTROL_PLANE_DEPLOYMENT_AUDIENCE || 'https://api.platform.learny.technology/deployments' }}
      REQUEST_PROJECT_ID: ${{ inputs.project_id }}
      REQUEST_ENVIRONMENT: ${{ inputs.environment }}
      REQUEST_PIPELINE_ID: ${{ inputs.pipeline_id }}
      REQUEST_SOURCE_SHA: ${{ inputs.source_sha }}
      REQUEST_DEFINITION_HASH: ${{ inputs.definition_hash }}
      REQUEST_MIGRATION_HEADS_JSON: ${{ inputs.migration_heads_json }}
      REQUEST_ROLLBACK_COMPATIBLE: ${{ inputs.rollback_compatible }}
      REQUEST_REASON: ${{ inputs.reason }}
    steps:
      - name: Request immutable promotion intent
        id: request
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.parse
          import urllib.request
          import uuid
          from pathlib import Path

          identifier = re.compile(r"^[a-z0-9][a-z0-9-]{0,79}$")
          project_id = os.environ["REQUEST_PROJECT_ID"]
          environment = os.environ["REQUEST_ENVIRONMENT"]
          pipeline_id = os.environ["REQUEST_PIPELINE_ID"]
          source_sha = os.environ["REQUEST_SOURCE_SHA"]
          definition_hash = os.environ["REQUEST_DEFINITION_HASH"]
          reason = os.environ["REQUEST_REASON"]
          if (
              identifier.fullmatch(project_id) is None
              or len(project_id) < 2
              or identifier.fullmatch(environment) is None
              or identifier.fullmatch(pipeline_id) is None
              or re.fullmatch(r"[0-9a-f]{40}", source_sha) is None
              or re.fullmatch(r"[0-9a-f]{64}", definition_hash) is None
              or not 1 <= len(reason) <= 500
          ):
              raise SystemExit("Deployment request inputs are invalid")
          try:
              migration_heads = json.loads(
                  os.environ["REQUEST_MIGRATION_HEADS_JSON"]
              )
          except json.JSONDecodeError as exc:
              raise SystemExit("Migration heads must be a JSON array") from exc
          if (
              not isinstance(migration_heads, list)
              or len(migration_heads) > 50
              or any(
                  not isinstance(item, str)
                  or not 1 <= len(item) <= 128
                  or re.fullmatch(r"[A-Za-z0-9._-]+", item) is None
                  for item in migration_heads
              )
          ):
              raise SystemExit("Migration heads are invalid")

          oidc_url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          separator = "&" if "?" in oidc_url else "?"
          oidc_request = urllib.request.Request(
              oidc_url
              + separator
              + "audience="
              + urllib.parse.quote(
                  os.environ["CONTROL_PLANE_DEPLOYMENT_AUDIENCE"],
                  safe="",
              ),
              headers={
                  "Authorization": "Bearer "
                  + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
              },
          )
          with urllib.request.urlopen(oidc_request, timeout=30) as response:
              oidc_token = json.load(response).get("value")
          if not isinstance(oidc_token, str) or not oidc_token:
              raise SystemExit("GitHub Actions OIDC token was not issued")

          payload = {
              "project_id": project_id,
              "environment_id": environment,
              "pipeline_id": pipeline_id,
              "source_revision": source_sha,
              "definition_hash": definition_hash,
              "migration_heads": migration_heads,
              "rollback_compatible": (
                  os.environ["REQUEST_ROLLBACK_COMPATIBLE"].lower() == "true"
              ),
              "reason": reason,
          }
          run_id = os.environ["GITHUB_RUN_ID"]
          request = urllib.request.Request(
              os.environ["CONTROL_PLANE_URL"].rstrip("/")
              + "/v1/deployments/promotion-intents",
              data=json.dumps(payload, separators=(",", ":")).encode(),
              headers={
                  "Authorization": f"Bearer {oidc_token}",
                  "Content-Type": "application/json",
                  "Idempotency-Key": (
                      f"deployment-request:{os.environ['GITHUB_REPOSITORY_ID']}:"
                      f"{run_id}"
                  ),
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  operation = json.load(response)
          except urllib.error.HTTPError as exc:
              raise SystemExit(
                  f"Control Plane rejected deployment request with HTTP {exc.code}"
              ) from exc
          operation_id = operation.get("id") if isinstance(operation, dict) else None
          operation_status = (
              operation.get("status") if isinstance(operation, dict) else None
          )
          requested_by = (
              operation.get("requested_by") if isinstance(operation, dict) else None
          )
          if (
              not isinstance(operation_id, str)
              or str(uuid.UUID(operation_id)) != operation_id
              or operation.get("project_id") != project_id
              or operation.get("environment_id") != environment
              or operation.get("pipeline_id") != pipeline_id
              or operation.get("source_revision") != source_sha
              or operation_status
              not in {
                  "pending_artifacts",
                  "pending_approval",
                  "requested",
                  "dispatching",
              }
              or requested_by
              != (
                  f"github-actions:{os.environ['GITHUB_REPOSITORY_ID']}:"
                  f"{run_id}"
              )
          ):
              raise SystemExit("Control Plane returned an invalid deployment operation")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as output:
              output.write(f"operation_id={operation_id}\n")
              output.write(f"operation_status={operation_status}\n")
          print(
              json.dumps(
                  {
                      "operation_id": operation_id,
                      "status": operation_status,
                  },
                  sort_keys=True,
              )
          )
          PY
