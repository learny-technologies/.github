name: Learny source gate
description: Validate the repository automation contract without repeating framework tests.

runs:
  using: composite
  steps:
    - name: Install schema validator
      shell: bash
      run: python -m pip install --disable-pip-version-check -r "$GITHUB_ACTION_PATH/../../requirements-dev.txt"
    - name: Validate repository automation
      shell: bash
      run: >-
        python "$GITHUB_ACTION_PATH/../../scripts/validate_automation.py"
        automation.yaml
        --repository-root .
    - name: Validate canonical product manifest
      if: ${{ hashFiles('project.yaml') != '' }}
      shell: bash
      run: >-
        python "$GITHUB_ACTION_PATH/../../scripts/validate_product_manifest.py"
        project.yaml
