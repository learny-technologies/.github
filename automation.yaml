apiVersion: automation.learny.technology/v1alpha1
kind: RepositoryAutomation
metadata:
  repository: learny-technologies/.github
  profiles:
    - docs-gated
localValidation:
  scopes:
    - id: automation-contract
      paths:
        - ".github/workflows/**"
        - "scripts/validate_local.py"
        - "automation.yaml"
      commands:
        - "python scripts/validate_automation.py automation.yaml --repository-root ."
        - "actionlint"
        - "git diff --check"
    - id: automation-implementation
      paths:
        - "actions/**"
        - "schemas/**"
        - "scripts/**"
        - "tests/**"
      commands:
        - "python -m unittest discover -s tests -v"
sourceGate:
  enabled: true
  checkName: Validation gate
artifacts: []
delivery:
  pipelines: []
